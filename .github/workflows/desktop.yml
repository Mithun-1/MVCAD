name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const v=require('./package.json').version; if(process.env.GITHUB_REF_NAME!=='v'+v) throw Error('Release tag must match package.json version')"
      - run: npx install-electron --no
      - run: npm run test:engine
      - run: npm run build
      - run: npm run test:desktop
      - name: Package installer
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/verify-update-artifacts.mjs
      - name: Test packaged Windows app
        if: matrix.target == 'win'
        run: |
          $env:DESKTOP_EXECUTABLE = Join-Path $PWD 'release/win-unpacked/MVCAD.exe'
          npm run test:desktop
          node scripts/test-updater-download.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: MVCAD-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
            !release/builder-debug.yml
            !release/builder-effective-config.yaml
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" installers/* --draft --title "MVCAD $RELEASE_TAG" --notes "Windows: MVCAD.exe installer with in-app update checks, download progress, and restart-to-update. Mac / Browser: https://mithun-1.github.io/MVCAD/ (no installer required). Windows is unsigned. Existing 0.1.0 installs require one manual installation to gain the update button."
          gh release edit "$RELEASE_TAG" --draft=false --latest
