name: Build, test and package
on:
  push:
    branches: [main]
    tags: ['v*-dev.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            host: windows
            arch: win64_msvc2022_64
            qt_subdir: msvc2022_64
            package: windows-x64
          - os: macos-14
            host: mac
            arch: clang_64
            qt_subdir: macos
            package: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Activate MSVC 2022
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install build tools
        run: python -m pip install aqtinstall==3.3.0 cmake==3.31.6 ninja==1.11.1.3
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-6.8.3-${{ matrix.host }}-${{ matrix.arch }}-v1
        id: qt-cache
      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: python -m aqt install-qt ${{ matrix.host }} desktop 6.8.3 ${{ matrix.arch }} --outputdir "${{ runner.temp }}/Qt" --archives qtbase qtsvg
      - name: Cache CAD kernel
        uses: actions/cache@v4
        id: occt-cache
        with:
          path: .tools/occt
          key: occt-7.9.3-minimal-shared-${{ matrix.os }}-v1
      - name: Build CAD kernel
        if: steps.occt-cache.outputs.cache-hit != 'true'
        run: python scripts/bootstrap-occt.py --jobs 3
      - name: Configure
        run: cmake --preset release -DCMAKE_PREFIX_PATH="${{ runner.temp }}/Qt/6.8.3/${{ matrix.qt_subdir }}"
      - name: Build
        run: cmake --build --preset release --parallel 3
      - name: Add Qt runtime to Windows PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "${{ runner.temp }}/Qt/6.8.3/${{ matrix.qt_subdir }}/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "${{ github.workspace }}/.tools/occt/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Test
        run: ctest --preset release
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress
      - name: Package
        working-directory: build/release
        run: cpack -C Release
      - name: Preserve test report and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.package }}
          path: |
            build/release/Testing/Temporary/LastTest.log
            build/release/core-results.txt
            build/release/cad-results.txt
            build/release/document-results.txt
            build/release/ui-smoke.png
            build/release/ui-smoke-error.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MVCAD-${{ matrix.package }}
          if-no-files-found: error
          path: |
            build/release/MVCAD-*.zip
            build/release/MVCAD-*.exe
            build/release/MVCAD-*.dmg
  prerelease:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MVCAD-*
          merge-multiple: true
          path: packages
      - name: Publish development preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' 'Native Qt development preview toward v1.0. Supports reference-plane sketches, exact solid extrusion/cuts, point import and centerline creation, branch diameter editing, part saving and undo/redo. See the repository README for supported junction geometry and limitations. General constrained sketches and STEP export remain under development. Packages are unsigned.' > notes.md
          gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --title "MVCAD $GITHUB_REF_NAME — development preview" --notes-file notes.md --prerelease
